<title>预警模型杠杆策略</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#111827; --ink2:#4B5563; --mut:#6B7280; --line:#E3E6EB; --grid:#E9ECF0;
  --red:#CE5A4E; --blue:#3D7FB8; --yel:#D9A91F; --ok:#1F7A4D; --okbg:rgba(31,122,77,.08); --nobg:rgba(206,90,78,.07);
  --main:#111827; --tqqq:#9AA3AF; --qqq:#4FA3A0;
  --band-r:rgba(206,90,78,.11); --band-y:rgba(232,194,74,.20); --band-b:rgba(61,127,184,.13); --band-g:rgba(107,114,128,.11);
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B0F16; --surface:#111823; --ink:#E6EAF0; --ink2:#AEB8C4; --mut:#8A96A6; --line:#1F2A38; --grid:#1A2330;
  --red:#E07366; --blue:#5B9BD5; --yel:#E8C24A; --ok:#5FC08D; --okbg:rgba(95,192,141,.10); --nobg:rgba(224,115,102,.09);
  --main:#E6EAF0; --tqqq:#5E6B7B; --qqq:#5DB8B4;
  --band-r:rgba(224,115,102,.14); --band-y:rgba(232,194,74,.14); --band-b:rgba(91,155,213,.16); --band-g:rgba(138,150,166,.12);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0F16; --surface:#111823; --ink:#E6EAF0; --ink2:#AEB8C4; --mut:#8A96A6; --line:#1F2A38; --grid:#1A2330;
  --red:#E07366; --blue:#5B9BD5; --yel:#E8C24A; --ok:#5FC08D; --okbg:rgba(95,192,141,.10); --nobg:rgba(224,115,102,.09);
  --main:#E6EAF0; --tqqq:#5E6B7B; --qqq:#5DB8B4;
  --band-r:rgba(224,115,102,.14); --band-y:rgba(232,194,74,.14); --band-b:rgba(91,155,213,.16); --band-g:rgba(138,150,166,.12);
}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.7 var(--sans)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,3.5vw,36px);padding-block:28px 72px;display:flex;flex-direction:column;gap:34px}
h1{font-size:26px;line-height:1.25;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h2{font-size:18px;margin:0 0 12px;font-weight:700;text-wrap:balance}
h3{font-size:14.5px;margin:22px 0 8px;font-weight:700}
p{margin:0 0 10px;max-width:72ch}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-weight:400}
.lede{color:var(--ink2);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-family:var(--mono);font-size:11.5px;color:var(--ink2);border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:3px 8px}
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.vcard h2{margin:0}
.vcard .win{font-family:var(--mono);font-size:12px;color:var(--mut);margin:0 0 8px}
.vhead,.vrow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:baseline}
.vhead span{font-size:11.5px;color:var(--mut);text-align:right;letter-spacing:.04em}
.vrow{padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.vrow b{text-align:right;font-weight:500}
.vrow.main b{font-size:17px}
.vcard.ok .vrow.main b:first-of-type{color:var(--ok)}
.vrow.bm{color:var(--mut)}
.vnote{font-size:13px;color:var(--ink2);margin-top:8px}
.warn{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:4px;padding:14px 18px}
.warn p,.warn li{font-size:13.5px}
.warn ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:80ch}
.strat{display:flex;flex-direction:column}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
.rules ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.rules li{font-size:13.8px}
.rules .param{font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin:16px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .k{display:inline-block;width:18px;height:0;border-top:2px solid}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.legend .sw{display:inline-block;width:14px;height:10px;border-radius:2px}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 6px 2px;overflow-x:auto}
.chart{width:100%;min-width:640px;height:auto;display:block}
.ax{font:10.5px var(--mono);fill:var(--mut)}
.lab{font:11px var(--mono)}
.grid{stroke:var(--grid);stroke-width:1}
.grid.faint{stroke-dasharray:2 3}
.ln{fill:none;stroke-width:1.2;stroke-linejoin:round}
.ln.s-main{stroke:var(--main);stroke-width:1.9}
.ln.s-tqqq{stroke:var(--tqqq)}
.ln.s-qqq{stroke:var(--qqq)}
.lab.s-main{fill:var(--main);font-weight:500}.lab.s-tqqq{fill:var(--tqqq)}.lab.s-qqq{fill:var(--qqq)}
.k.s-main{border-color:var(--main)}.k.s-tqqq{border-color:var(--tqqq)}.k.s-qqq{border-color:var(--qqq)}
.dd{stroke-width:1;fill-opacity:.10}
.dd.s-main{stroke:var(--main);fill:var(--main);fill-opacity:.12}
.dd.s-tqqq{stroke:var(--tqqq);fill:none}
.dd.s-qqq{stroke:var(--qqq);fill:none}
.limit{stroke:var(--red);stroke-dasharray:5 4;stroke-width:1.2}
.ax.lim{fill:var(--red)}
.band-r{fill:var(--band-r);background:var(--band-r)}.band-y{fill:var(--band-y);background:var(--band-y)}
.band-b{fill:var(--band-b);background:var(--band-b)}.band-g{fill:var(--band-g);background:var(--band-g)}
circle.m-red,.dot.m-red{fill:var(--red);background:var(--red)}
circle.m-blue,.dot.m-blue{fill:var(--blue);background:var(--blue)}
circle.m-yel,.dot.m-yel{fill:var(--yel);background:var(--yel);stroke:var(--surface);stroke-width:.8}
.cap{font-size:12px;color:var(--mut);margin:6px 0 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 28px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--mut);font-size:12px;text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.mono,th:not(:first-child){text-align:right}
td.ok{color:var(--ok);font-weight:500}
tr.hl td{font-weight:700}
details{margin-top:10px;font-size:13px}
summary{cursor:pointer;color:var(--ink2)}
summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
section>p,section li{font-size:14px}
section ul{padding-left:1.2em;max-width:80ch}
@media (max-width:520px){.vhead,.vrow{grid-template-columns:1fr 70px 70px}h1{font-size:22px}}
</style>
